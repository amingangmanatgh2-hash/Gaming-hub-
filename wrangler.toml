# ============================================================
#  Self-Bot Hub — Telegram Self-Maker Bot + Web Admin Panel
#  Deploy target: Cloudflare Workers (+ KV, optional D1)
# ============================================================

name = "self-bot-hub"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# ---------- KV (required) ----------
# ساخت فضای KV:
#   npx wrangler kv namespace create SELFBOT_KV
# سپس id زیر را با مقدار واقعی جایگزین کنید.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ---------- D1 (اختیاری — آینه‌ی داده‌ها برای گزارش‌گیری) ----------
# npx wrangler d1 create selfbot-db
# npx wrangler d1 execute selfbot-db --file=./schema.sql
# سپس کامنت‌ها را بردارید:
# [[d1_databases]]
# binding = "DB"
# database_name = "selfbot-db"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ---------- Cron Trigger ----------
# هر ۲۴ ساعت: کسر ۳۰ الماس هزینه نگهداری از سلف‌های فعال
[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
