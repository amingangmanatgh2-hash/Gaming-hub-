# ShadowCore — Gradle properties
# Minecraft 1.21.1 is LTS for Fabric 1.21.x mods (compatible with 1.21 — 1.21.1 clients)
# For 1.21.4+ bump minecraft_version + yarn_mappings + fabric_version accordingly.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod metadata
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Fabric API 0.107.x aligns with 1.21.1 — check https://modmuss50.me/fabric.html
fabric_version=0.107.0+1.21.1

# Mod version + Maven coordinates
mod_version=1.1.0
maven_group=com.shadowcore
archives_base_name=shadowcore
