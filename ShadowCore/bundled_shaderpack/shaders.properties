# ShadowCore BW — Iris shaderpack config
# Lightweight, bright, BedWars optimized

# Disable heavy effects for FPS
shadowMapResolution=512
shadowDistance=64.0
shadowIntervalSize=2.0
generateShadowMipmap=false
generateShadowColorMipmap=false
shadowHardwareFiltering=false

# Fast composite
screenWidth=1920
screenHeight=1080

# Brightness boost for BW (see enemies in shadows)
ambientOcclusionLevel=0.4
bloomStrength=0.02
