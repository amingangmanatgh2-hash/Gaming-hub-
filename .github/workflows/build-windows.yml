name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'AMINKeyboardClipboard/**'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'kb-v*'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Release, .NET Framework 4.8)
        shell: pwsh
        run: |
          dotnet build AMINKeyboardClipboard/AMINKeyboardClipboard.csproj `
            -c Release `
            --nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build log on failure
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path build.log)) { "no build log" | Out-File build.log }
          $log = (Get-Content build.log -Raw)
          if ($log.Length -gt 60000) { $log = $log.Substring($log.Length - 60000) }
          $log | Out-File -FilePath body.md -Encoding utf8
          $existing = gh issue list --search "CI BUILD LOG in:title" --state open --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment $existing --body-file body.md
          } else {
            gh issue create --title "CI BUILD LOG" --body-file body.md
          }
          Get-ChildItem AMINKeyboardClipboard/obj -Recurse -Filter *.log -ErrorAction SilentlyContinue | Select-Object FullName
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show build output
        if: success()
        shell: pwsh
        run: Get-ChildItem -Recurse AMINKeyboardClipboard/bin/Release | Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc 'AMINKeyboardClipboard/installer/AMINKeyboardClipboard.iss'
          Get-ChildItem AMINKeyboardClipboard/installer/Output

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: AMINKeyboardClipboard-portable
          path: AMINKeyboardClipboard/bin/Release/net48/*

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMINKeyboardClipboard-setup
          path: AMINKeyboardClipboard/installer/Output/*.exe
