name: Build Windows app (native)

# Builds the native Win32 app (no .NET at all) and, on a kb-v* tag, publishes a
# GitHub release with the installer, both portable builds and SHA-256 checksums.

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    tags: ['kb-v*']
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Visual Studio C++ toolchain
        id: vs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $path) { throw "No MSVC toolchain found" }
          Write-Host "Visual Studio: $path"
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build x64
        shell: cmd
        working-directory: AMINKeyboardClipboardNative
        run: call "${{ steps.vs.outputs.path }}\VC\Auxiliary\Build\vcvars64.bat" && build.bat x64

      - name: Build x86
        shell: cmd
        working-directory: AMINKeyboardClipboardNative
        run: call "${{ steps.vs.outputs.path }}\VC\Auxiliary\Build\vcvars32.bat" && build.bat x86

      - name: Show dependencies (proof there is no .NET runtime dependency)
        shell: cmd
        working-directory: AMINKeyboardClipboardNative
        run: |
          call "${{ steps.vs.outputs.path }}\VC\Auxiliary\Build\vcvars64.bat" && dumpbin /dependents build\x64\AMINKeyboardClipboard.exe && dumpbin /headers build\x64\AMINKeyboardClipboard.exe | findstr /i subsystem

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        working-directory: AMINKeyboardClipboardNative
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc 'installer\AMINKeyboardClipboard.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer\Output

      - name: Package portable builds and checksums
        shell: pwsh
        working-directory: AMINKeyboardClipboardNative
        run: |
          Compress-Archive -Path 'build\x64\AMINKeyboardClipboard.exe' -DestinationPath 'AMINKeyboardClipboard-win64.zip' -Force
          Compress-Archive -Path 'build\x86\AMINKeyboardClipboard.exe' -DestinationPath 'AMINKeyboardClipboard-win32.zip' -Force

          $lines = @()
          foreach ($f in @('installer\Output\AMINKeyboardClipboardSetup.exe',
                           'AMINKeyboardClipboard-win64.zip',
                           'AMINKeyboardClipboard-win32.zip')) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMINKeyboardClipboard-native
          path: |
            AMINKeyboardClipboardNative/build/x64/AMINKeyboardClipboard.exe
            AMINKeyboardClipboardNative/build/x86/AMINKeyboardClipboard.exe
            AMINKeyboardClipboardNative/installer/Output/AMINKeyboardClipboardSetup.exe
            AMINKeyboardClipboardNative/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/kb-v')
        shell: pwsh
        working-directory: AMINKeyboardClipboardNative
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            'installer\Output\AMINKeyboardClipboardSetup.exe',
            'AMINKeyboardClipboard-win64.zip',
            'AMINKeyboardClipboard-win32.zip',
            'SHA256SUMS.txt'
          )

          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($existing) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --title "AMIN Keyboard & Clipboard ${{ github.ref_name }}" `
              --notes-file RELEASE_NOTES.md `
              --latest=true
          }
