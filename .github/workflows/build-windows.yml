name: Build AMIN Keyboard & Clipboard (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'AMIN_Keyboard_Clipboard/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        shell: pwsh
        run: msbuild "AMIN_Keyboard_Clipboard\AMIN_Keyboard_Clipboard\AMIN_Keyboard_Clipboard.csproj" /p:Configuration=Release /p:Platform=AnyCPU /v:m /nologo

      - name: Zip the exe
        shell: pwsh
        run: Compress-Archive -Path "AMIN_Keyboard_Clipboard\AMIN_Keyboard_Clipboard\bin\Release\AMIN_Keyboard_Clipboard.exe" -DestinationPath "AMIN_Keyboard_Clipboard_Release.zip" -Force

      - name: Build Inno Setup installer (best effort)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --accept-source-agreements --accept-package-agreements
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "AMIN_Keyboard_Clipboard\installer\AMIN_Keyboard_Clipboard.iss"
        continue-on-error: true

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMIN_Keyboard_Clipboard_exe
          path: |
            AMIN_Keyboard_Clipboard_Release.zip
            AMIN_Keyboard_Clipboard\AMIN_Keyboard_Clipboard\bin\Release\AMIN_Keyboard_Clipboard.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AMIN_Keyboard_Clipboard_installer
          path: AMIN_Keyboard_Clipboard\installer\Output\*.exe
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: AMIN_Keyboard_Clipboard_exe
          path: dist/
      - name: Download installer artifact (optional)
        uses: actions/download-artifact@v4
        with:
          name: AMIN_Keyboard_Clipboard_installer
          path: dist/
        continue-on-error: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') ? github.ref_name : 'v1.0.0' }}
          name: AMIN Keyboard & Clipboard v1.0.0
          files: dist/**
          overwrite_assets: true
          body: |
            AMIN Keyboard & Clipboard — Persian/English virtual keyboard + clipboard history manager.

            - Windows 10 1803+ (WPF, .NET Framework 4.8)
            - Persian (ISIRI) + English (QWERTY) on-screen keyboard
            - Floating always-on-top keyboard & clipboard popup
            - Clipboard history (100 items, local JSON, no telemetry)
            - Global hotkeys: Ctrl+Alt+K / Ctrl+Alt+V
            - Start with Windows (no admin needed)

            Assets: portable exe (zip), standalone exe, Inno Setup installer.
