name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    tags: ['kb-v*']
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (Release, .NET Framework 4.8)
        shell: pwsh
        run: |
          dotnet build AMINKeyboardClipboard/AMINKeyboardClipboard.csproj `
            -c Release `
            --nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show build output
        if: success()
        shell: pwsh
        run: Get-ChildItem -Recurse AMINKeyboardClipboard/bin/Release/net48 | Select-Object Name, Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc 'AMINKeyboardClipboard/installer/AMINKeyboardClipboard.iss'
          Write-Host "exit code: $LASTEXITCODE"
          Get-ChildItem AMINKeyboardClipboard/installer/Output
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path 'AMINKeyboardClipboard/bin/Release/net48/*' `
            -DestinationPath 'AMINKeyboardClipboard-portable.zip' -Force
          Get-FileHash AMINKeyboardClipboard/installer/Output/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-FileHash AMINKeyboardClipboard-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AMINKeyboardClipboard-portable.zip" } |
            Out-File -FilePath SHA256SUMS.txt -Encoding ascii -Append
          Get-Content SHA256SUMS.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: AMINKeyboardClipboard-portable
          path: AMINKeyboardClipboard/bin/Release/net48/*

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMINKeyboardClipboard-setup
          path: AMINKeyboardClipboard/installer/Output/*.exe

      # ---- Release (tags kb-v*) ------------------------------------------
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/kb-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            'AMINKeyboardClipboard/installer/Output/AMINKeyboardClipboardSetup.exe',
            'AMINKeyboardClipboard-portable.zip',
            'SHA256SUMS.txt'
          )

          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($existing) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets `
              --title "AMIN Keyboard & Clipboard 1.0.0" `
              --notes-file AMINKeyboardClipboard/RELEASE_NOTES.md `
              --latest=false
          }
