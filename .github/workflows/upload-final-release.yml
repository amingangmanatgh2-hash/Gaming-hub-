name: Upload final PowerPoint
on:
  push:
    branches: [arena/01a0fd1b-gaming-hub]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp 'output/چرا_به_قانون_نیاز_داریم_نسخه_نهایی.pptx' PowerPoint-Final.pptx
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v9.0.0 PowerPoint-Final.pptx --clobber
