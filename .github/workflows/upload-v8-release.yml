name: Upload v8 release files

on:
  push:
    branches:
      - arena/01a0fd1b-gaming-hub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out session branch
        uses: actions/checkout@v4

      - name: Prepare clear download names
        run: |
          mkdir release-files
          cp 'output/چرا_به_قانون_نیاز_داریم_نسخه_۸_تیک‌تاک_کنفرانس.pptx' 'release-files/PowerPoint-v8.pptx'
          cp 'output/متن_اعضا_نسخه_۸/امین کریم‌پور.pdf' 'release-files/01-Amin-Karimpour.pdf'
          cp 'output/متن_اعضا_نسخه_۸/عزیزی.pdf' 'release-files/02-Azizi.pdf'
          cp 'output/متن_اعضا_نسخه_۸/طاها عابدی‌فر.pdf' 'release-files/03-Taha-Abedifar.pdf'
          cp 'output/متن_اعضا_نسخه_۸/گله‌دار.pdf' 'release-files/04-Galedar.pdf'
          cp 'output/متن_اعضا_نسخه_۸/محمدرضا فولادی.pdf' 'release-files/05-Mohammadreza-Fooladi.pdf'

      - name: Upload exactly six release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v8.0.0 release-files/* --clobber
